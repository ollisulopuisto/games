[package]
name = "bubbles"
version = "26.5.31"
edition = "2021"

[dependencies]
macroquad = { version = "0.4", features = ["audio"] }
quad-rand = "0.2"
serde = { version = "1.0", features = ["derive"] }
shared = { path = "../shared" }

[lints.rust]
unsafe_code = "allow"
warnings = "warn"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = 'abort'
strip = true
