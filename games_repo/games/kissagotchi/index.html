<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kissagotchi</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            touch-action: none; /* Prevent scroll on mobile */
        }
        canvas {
            display: block;
            max-width: 100vw;
            max-height: 100vh;
            image-rendering: pixelated;
        }
    </style>
</head>
<body>
    <canvas id="glcanvas" tabindex='1'></canvas>
    <script src="mq_js_bundle.js"></script>
    <script>
        let saved_state = "";
        function update_saved_state_cache() {
            saved_state = localStorage.getItem("kissagotchi_state") || "";
        }

        class KissagotchiPlugin {
            constructor() {
                this.name = "KissagotchiPlugin";
            }
            import_object() {
                return {
                    env: {
                        js_get_state_len: function() {
                            update_saved_state_cache();
                            return lengthBytesUTF8(saved_state);
                        },
                        js_get_state: function(ptr) {
                            stringToUTF8(saved_state, ptr, saved_state.length + 10);
                        },
                        js_save_state: function(ptr) {
                            localStorage.setItem("kissagotchi_state", UTF8ToString(ptr));
                        },
                        js_get_now_ms: function() {
                            return Date.now();
                        }
                    }
                };
            }
        }
        register_plugin(new KissagotchiPlugin());

        load("kissagotchi_wasm.wasm");
    </script>
</body>
</html>
