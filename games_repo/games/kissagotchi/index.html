<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kissagotchi</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            touch-action: none; /* Prevent scroll on mobile */
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            max-width: 100vw;
            max-height: 100vh;
            image-rendering: pixelated;
            outline: none;
            z-index: 5;
        }
        #start-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #1a1a2e;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        #start-button {
            padding: 1.5rem 3rem;
            font-size: 2rem;
            font-weight: bold;
            color: #111;
            background: #4af;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(74, 170, 255, 0.4);
        }
    </style>
</head>
<body>
    <canvas id="glcanvas" tabindex='1'></canvas>
    <div id="start-overlay">
        <button id="start-button" onclick="startGame()">START GAME</button>
    </div>
    <script src="../../scripts/platform.js"></script>
    <script src="../../scripts/audio_unlock.js"></script>
    <script src="mq_js_bundle.js"></script>
    <script>
        let saved_state = "";
        function update_saved_state_cache() {
            saved_state = localStorage.getItem("kissagotchi_state") || "";
        }

        miniquad_add_plugin({
            name: "kissagotchi",
            version: 1,
            register_plugin: function(importObject) {
                importObject.env.js_get_state_len = function() {
                    update_saved_state_cache();
                    return new TextEncoder().encode(saved_state).length;
                };
                importObject.env.js_get_state = function(ptr) {
                    var encoded = new TextEncoder().encode(saved_state);
                    var mem = new Uint8Array(wasm_memory.buffer, ptr, encoded.length);
                    mem.set(encoded);
                };
                importObject.env.js_save_state = function(ptr) {
                    var mem = new Uint8Array(wasm_memory.buffer, ptr);
                    var len = 0;
                    while (mem[len] !== 0) len++;
                    var str = new TextDecoder().decode(mem.subarray(0, len));
                    localStorage.setItem("kissagotchi_state", str);
                };
                importObject.env.js_get_now_ms = function() {
                    return Date.now();
                };
            }
        });

        let started = false;
        function startGame() {
            if (started) return;
            started = true;
            if (typeof resumeAudio === "function") resumeAudio();
            document.getElementById('start-overlay').style.display = 'none';
            const canvas = document.getElementById('glcanvas');
            if (canvas) canvas.focus();
            load("kissagotchi_wasm.wasm");
        }

        if (!window.GamePlatform || !window.GamePlatform.isIOS()) {
            startGame();
        }
    </script>
</body>
</html>
